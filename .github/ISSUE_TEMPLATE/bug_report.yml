name: Bug report
description: Tell us what went wrong.
body:
  - type: markdown
    attributes:
      value: Please remove private text, files and credentials from anything you attach.
  - type: input
    id: version
    attributes:
      label: macino version
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: macOS version and Mac chip
      placeholder: macOS 14.7, Apple M1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include the steps, what you expected and what happened instead.
    validations:
      required: true
